<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(0,0,0,0.08)"/>
  <!-- logo -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#9CA3AF"/>
  <text x="112" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800" letter-spacing="-1" fill="#0A0B0D">HR</text>
  <text x="164" y="123" font-family="'Pretendard', system-ui, sans-serif" font-size="26" font-weight="600" fill="#0A0B0D">Hyeongrae Rho</text>
  <!-- eyebrow — sits higher than the old two-line layout (was y=300) to make
       vertical room for the three-line headline below. -->
  <text x="80" y="272" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="4" fill="#6B7280">AI ENGINEERING · FULL-STACK</text>
  <!-- headline — mirrors the site's h1 copy (Portfolio.tsx `headline` prop),
       reflowed to three lines: this copy is too wide for two lines at any
       readable size (the middle line alone measures 732px at 64px). font-size
       64 keeps every line clear of the 1200 canvas edge. The 76px baseline gap
       keeps the site's 1.19 line-height ratio. -->
  <text x="78" y="352" font-family="'Pretendard', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#0A0B0D">코드를 짜던 개발자에서,</text>
  <!-- highlight box mirrors the site's <span> marker on 구조 (--hl-bg /
       --hl-ink). SVG can't size a box to a text run, so these numbers are
       measured, not guessed: the tspan's rendered getBBox (x=423.4 w=108.3
       h=76, top 61 above the baseline, under the real CDN fonts) expanded by
       the site's span padding (0.02em 0.16em at 64px = 1.28 / 10.24).
       Re-measure with a headless render if the headline, font, or size
       changes — eyeballing them drifts. -->
  <rect x="413.2" y="365.7" width="128.8" height="78.6" rx="4" fill="#9CA3AF"/>
  <text x="78" y="428" font-family="'Pretendard', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#0A0B0D">바이브가 아닌 <tspan>구조</tspan>를 설계하는</text>
  <text x="78" y="504" font-family="'Pretendard', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#0A0B0D">AI 엔지니어로.</text>
  <!-- footer -->
  <circle cx="90" cy="560" r="6" fill="#84CC16"/>
  <text x="106" y="567" font-family="'Pretendard', system-ui, sans-serif" font-size="22" fill="#4B5563">2026 채용·프로젝트·협업·문의 환영 · rhl9509@naver.com</text>
</svg>
