<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(0,0,0,0.08)"/>
  <!-- logo -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#9CA3AF"/>
  <text x="112" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800" letter-spacing="-1" fill="#0A0B0D">HR</text>
  <text x="164" y="123" font-family="'Pretendard', system-ui, sans-serif" font-size="26" font-weight="600" fill="#0A0B0D">Hyeongrae Rho</text>
  <!-- eyebrow -->
  <text x="80" y="300" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="4" fill="#6B7280">AI ENGINEERING · FULL-STACK</text>
  <!-- headline — mirrors the site's h1 copy (Portfolio.tsx `headline` prop).
       font-size 78 keeps the second line clear of the 1200 canvas edge
       (its right edge measures ~1004). The 93px baseline gap keeps the site's
       1.19 line-height ratio. -->
  <text x="78" y="392" font-family="'Pretendard', system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#0A0B0D">코드를 짜던 개발자에서,</text>
  <!-- highlight box mirrors the site's <span> marker on 구조 (--hl-bg /
       --hl-ink). SVG can't size a box to a text run, so these numbers are
       measured, not guessed: the tspan's rendered getBBox (x=78 w=131.4 h=93,
       top 74 above the baseline, under the real CDN fonts) expanded by the
       site's span padding (0.02em 0.16em at 78px = 1.56 / 12.48). 구조 opens
       the line, so the box pads left of x=78 into the margin — same as the
       site's span. Re-measure with a headless render if the headline, font,
       or size changes — eyeballing them drifts. -->
  <rect x="65.5" y="409.4" width="156.4" height="96.1" rx="5" fill="#9CA3AF"/>
  <text x="78" y="485" font-family="'Pretendard', system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#0A0B0D"><tspan>구조</tspan>를 설계하는 AI 엔지니어로.</text>
  <!-- footer -->
  <circle cx="90" cy="560" r="6" fill="#84CC16"/>
  <text x="106" y="567" font-family="'Pretendard', system-ui, sans-serif" font-size="22" fill="#4B5563">2026 채용·프로젝트·협업·문의 환영 · rhl9509@naver.com</text>
</svg>
