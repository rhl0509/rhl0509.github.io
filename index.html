<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Hyeongrae Rho</title>

    <!-- content is kept in step by the boot script below. The meta must come
         BEFORE the script: it runs at parse time, so anything it looks up has
         to exist already — placed after, getElementById returns null and the
         browser chrome stays light for dark-OS visitors until React mounts. -->
    <meta id="theme-color" name="theme-color" content="#ECEFF3" />

    <!-- set theme before paint to avoid flash of wrong theme.
         an explicit past choice wins; otherwise follow the OS. -->
    <script>
      (function () {
        var t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          var s = localStorage.getItem("theme");
          if (s === "dark" || s === "light") t = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        // theme-color must track the theme we actually rendered, not the OS —
        // a stored choice can disagree with prefers-color-scheme, which would
        // leave the browser chrome dark while the page is light.
        var m = document.getElementById("theme-color");
        if (m) m.setAttribute("content", t === "dark" ? "#08090B" : "#ECEFF3");
      })();
    </script>

    <!-- SEO -->

    <!-- the hero portrait is the LCP candidate; without a hint it is only
         discovered after React renders, one full network round-trip late -->

      rel="stylesheet"

    />
    <link
      rel="stylesheet"
      href="https://fastly.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css"
    />
    <style>
      * { box-sizing: border-box; }
      /* UA-drawn parts (scrollbars, form controls) follow the active theme —
         without this a dark page scrolls with a glaring light scrollbar */
      html { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      html, body {
        height: 100%;
        /* auto: scrollbars only appear when the card doesn't fit the viewport */
        overflow: auto;
      }
      body {
        margin: 0;
        display: flex;
        padding: 40px;
        background: #ECEFF3;
        transition: background-color 0.25s ease;
      }
      /* auto margins center the card vertically when it fits and never clip it
         when it overflows (unlike align-items: center, which cuts off the top
         with no way to scroll to it).
         width: 100% is load-bearing — as a bare flex item #root is sized by
         its contents, so its width stays indefinite, and the card's
         `width: min(1280px, 100%)` then has no percentage basis to resolve
         against: it silently degrades to shrink-to-fit, narrower than the
         space it was told to fill. */
      #root { margin: auto; width: 100%; }
      html[data-theme="dark"] body { background: #08090B; }
      @media (max-width: 1024px) {
        body { padding: 24px; }
      }
      /* small screens: keep the card top-aligned */
      @media (max-width: 720px) {
        body { padding: 16px; }
        #root { margin-top: 0; }
      }
      @media (max-width: 400px) {
        body { padding: 10px; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* the card already snaps under reduced motion (Portfolio.tsx);
           the frame must not keep fading on its own */
        body { transition: none; }
      }
      /* without JS the boot script never runs, so data-theme is never set and
         the frame stays light — one colour is enough here */
      noscript { margin: auto; text-align: center; font: 15px/1.7 'Pretendard Variable', Pretendard, system-ui, sans-serif; color: #4B5563; }
      noscript a { color: inherit; }
    </style>
  </head>
